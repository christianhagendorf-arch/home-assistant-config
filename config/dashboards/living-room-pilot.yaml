views:
- title: Erdgeschoss
  path: ground_floor
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:stack-in-card
      grid_options:
        columns: 12
      card_mod:
        style: "ha-card {\n  border: 1px solid var(--divider-color);\n  border-radius: 14px;\n  box-shadow: none;\n  overflow:\
          \ hidden;\n  --mush-icon-border-radius: 9px;\n  --mush-control-border-radius: 9px;\n  --mush-chip-border-radius:\
          \ 9px;\n}\n"
      cards:
      - type: custom:mushroom-template-card
        primary: Hauseingang
        tap_action:
          action: none
        card_mod:
          style: "ha-card {\n  border: 0 !important;\n  box-shadow: none !important;\n  background: transparent !important;\n\
            \  --card-primary-font-size: 14px;\n  --card-primary-line-height: 18px;\n  padding: 0 !important;\n}\nmushroom-state-item\
            \ {\n  min-height: 27px;\n  padding: 2px 10px 0 !important;\n}\n"
      - type: custom:mushroom-light-card
        entity: light.entrance_outside_sim
        name: Außenbeleuchtung
        icon: mdi:outdoor-lamp
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  border: 0 !important;\n  box-shadow: none !important;\n  background: transparent !important;\n\
            }\n"
