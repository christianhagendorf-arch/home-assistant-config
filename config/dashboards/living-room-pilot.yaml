              }}'
            icon: mdi:washing-machine
            icon_color: '{% if is_state(''input_boolean.washing_machine_power_sim'', ''off'') %}grey {% elif is_state(''input_select.washing_machine_state_sim'',
              ''Fertig'') %}green {% elif is_state(''input_select.washing_machine_state_sim'', ''Läuft'') %}blue {% else %}grey{%
              endif %}'
