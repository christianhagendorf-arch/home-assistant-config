views:
- title: Übersicht
  path: overview
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - &id001
      type: custom:mushroom-chips-card
      alignment: end
      chips:
      - type: template
        entity: input_select.dashboard_theme_sim
        icon: '{{ ''mdi:weather-night'' if is_state(''input_select.dashboard_theme_sim'', ''light'') else ''mdi:weather-sunny''
          }}'
        icon_color: '{{ ''indigo'' if is_state(''input_select.dashboard_theme_sim'', ''light'') else ''amber'' }}'
        tap_action:
          action: perform-action
          perform_action: script.dashboard_theme_toggle_sim
      card_mod:
        style: 'ha-card { border: 0 !important; box-shadow: none !important; background: transparent !important; padding:
          0 4px !important; }'
    - type: custom:mushroom-template-card
      primary: Erdgeschoss
      secondary: 5 Räume
      tap_action:
        action: none
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-top: 4px solid #3b82f6; border-radius: 14px; box-shadow:
          none; background: var(--card-background-color); }'
    - type: custom:stack-in-card
      grid_options:
        columns: 12
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-radius: 14px; box-shadow: none; overflow: hidden;
          --mush-icon-border-radius: 9px; --mush-control-border-radius: 9px; --mush-chip-border-radius: 9px; margin-bottom:
          8px; }'
      cards:
      - type: custom:mushroom-template-card
        primary: Hauseingang
        tap_action:
          action: none
        card_mod:
          style: 'ha-card { border: 0 !important; border-bottom: 1px solid var(--divider-color) !important; border-radius:
            0 !important; box-shadow: none !important; background: transparent !important; --card-primary-font-size: 13px;
            --card-primary-line-height: 17px; } mushroom-state-item { min-height: 28px; padding: 3px 10px 1px !important;
            }'
      - type: custom:mushroom-light-card
        entity: light.entrance_outside_sim
        name: Außenbeleuchtung
        icon: mdi:outdoor-lamp
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  border: 0 !important;\n  box-shadow: none !important;\n  background: transparent !important;\n\
            }\n"
    - type: custom:stack-in-card
      grid_options:
        columns: 12
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-radius: 14px; box-shadow: none; overflow: hidden;
          --mush-icon-border-radius: 9px; --mush-control-border-radius: 9px; --mush-chip-border-radius: 9px; margin-bottom:
          8px; }'
      cards:
      - type: custom:mushroom-template-card
