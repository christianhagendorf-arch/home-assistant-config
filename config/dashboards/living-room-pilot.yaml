views:
- title: Übersicht
  path: overview
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - &id001
      type: custom:mushroom-chips-card
      alignment: end
      chips:
      - type: template
        entity: input_select.dashboard_theme_sim
        icon: '{{ ''mdi:weather-night'' if is_state(''input_select.dashboard_theme_sim'', ''light'') else ''mdi:weather-sunny''
          }}'
        icon_color: '{{ ''indigo'' if is_state(''input_select.dashboard_theme_sim'', ''light'') else ''amber'' }}'
        tap_action:
          action: perform-action
          perform_action: script.dashboard_theme_toggle_sim
      card_mod:
        style: 'ha-card { border: 0 !important; box-shadow: none !important; background: transparent !important; padding:
          0 4px !important; }'
    - type: custom:stack-in-card
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-top: 4px solid #3b82f6; border-radius: 14px; box-shadow:
          none; }'
      cards:
      - type: custom:mushroom-template-card
        primary: Erdgeschoss
        secondary: 5 Räume · verfügbar
        tap_action:
          action: navigate
          navigation_path: /living-room-pilot/ground_floor
        card_mod:
          style: 'ha-card { border: 0 !important; box-shadow: none !important; background: transparent !important; }'
  - type: grid
    cards:
    - type: custom:stack-in-card
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-top: 4px solid #14b8a6; border-radius: 14px; box-shadow:
          none; }'
      cards:
      - type: custom:mushroom-template-card
        primary: Obergeschoss
        secondary: Dashboard folgt
        tap_action:
          action: navigate
          navigation_path: /living-room-pilot/first_floor
        card_mod:
          style: 'ha-card { border: 0 !important; box-shadow: none !important; background: transparent !important; }'
  - type: grid
    cards:
    - type: custom:stack-in-card
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-top: 4px solid #8b5cf6; border-radius: 14px; box-shadow:
          none; }'
      cards:
      - type: custom:mushroom-template-card
        primary: Dachgeschoss
        secondary: Dashboard folgt
        tap_action:
          action: navigate
          navigation_path: /living-room-pilot/second_floor
        card_mod:
          style: 'ha-card { border: 0 !important; box-shadow: none !important; background: transparent !important; }'
  - type: grid
    cards:
    - type: custom:stack-in-card
      card_mod:
        style: 'ha-card { border: 1px solid var(--divider-color); border-top: 4px solid #22a260; border-radius: 14px; box-shadow:
          none; }'
      cards:
      - type: custom:mushroom-template-card
        primary: Garten
        secondary: Dashboard folgt
        tap_action:
          action: navigate
          navigation_path: /living-room-pilot/garden
        card_mod:
          style: 'ha-card { border: 0 !important; box-shadow: none !important; background: transparent !important; }'
