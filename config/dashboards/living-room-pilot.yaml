views:
  - title: Erdgeschoss
    path: ground_floor
    icon: mdi:home-floor-0
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Wohnzimmer · Simulation
            icon: mdi:sofa-outline
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.living_room_temperature_sim
                icon: mdi:thermometer
                layout: horizontal
                primary_info: state
                secondary_info: none
                card_mod:
                  style: |
                    ha-card {
                      border-style: none;
                    }
              - type: custom:mushroom-climate-card
                entity: climate.living_room_sim
                layout: horizontal
                icon: mdi:radiator
                hvac_modes:
                  - "off"
                  - heat
                show_temperature_control: true
                primary_info: none
                secondary_info: none
                tap_action:
                  action: perform-action
                  perform_action: script.living_room_heat_toggle_sim
                hold_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      border-style: none;
                    }
          - type: custom:mushroom-light-card
            entity: light.living_room_demo_light_sim
            name: Dimmer (Sim)
            icon: mdi:lightbulb
            show_brightness_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_arc_lamp_sim
                name: Bogenlampe (Sim)
                icon: mdi:floor-lamp
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:mushroom-entity-card
                entity: input_boolean.living_room_tv_board_sim
                name: TV-Board (Sim)
                icon: mdi:television
                tap_action:
                  action: toggle
