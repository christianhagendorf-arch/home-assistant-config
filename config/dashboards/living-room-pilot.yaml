        card_mod:
          style: 'ha-card { border: 0 !important; border-bottom: 1px solid var(--divider-color) !important; border-radius:
            0 !important; box-shadow: none !important; background: transparent !important; --card-primary-font-size: 13px;
            --card-primary-line-height: 17px; } mushroom-state-item { min-height: 28px; padding: 3px 10px 1px !important;
            }'
      - type: custom:mushroom-light-card
