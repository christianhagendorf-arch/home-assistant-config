            chips:
            - type: template
              entity: input_boolean.washing_machine_notification_sim
              icon: '{{ ''mdi:bell-ring'' if is_state(''input_boolean.washing_machine_notification_sim'', ''on'') else ''mdi:bell-off-outline''
                }}'
              icon_color: '{{ ''blue'' if is_state(''input_boolean.washing_machine_notification_sim'', ''on'') else ''grey''
                }}'
              tap_action:
                action: toggle
            card_mod:
              style: "ha-card {\n  border: 0 !important;\n  box-shadow: none !important;\n  background: transparent !important;\n\
                \  padding: 8px 8px 0 0 !important;\n}"
