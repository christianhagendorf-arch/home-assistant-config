                    card_mod:
                      style: |
                        ha-card {
                          border: 0 !important;
                          box-shadow: none !important;
                          background: rgba(var(--rgb-primary-text-color), 0.035) !important;
                          border-radius: 12px !important;
                        }
                    cards:
                      - type: custom:mushroom-template-card
                        entity: input_boolean.washing_machine_power_sim
                        primary: Waschmaschine
                        secondary: >-
                          {{ 'Aus' if is_state('input_boolean.washing_machine_power_sim', 'off') else states('input_select.washing_machine_state_sim') }}
                        icon: mdi:washing-machine
                        icon_color: >-
                          {% if is_state('input_boolean.washing_machine_power_sim', 'off') %}grey
                          {% elif is_state('input_select.washing_machine_state_sim', 'Fertig') %}green
                          {% elif is_state('input_select.washing_machine_state_sim', 'Läuft') %}blue
                          {% else %}grey{% endif %}
                        badge_icon: >-
                          {{ 'mdi:bell' if is_state('input_boolean.washing_machine_notification_sim', 'on') else '' }}
                        badge_color: blue
                        tap_action:
                          action: toggle
                        hold_action:
                          action: more-info
                        card_mod:
                          style: |
                            ha-card {
                              border: 0 !important;
                              box-shadow: none !important;
                              background: transparent !important;
                            }
                      - type: custom:mushroom-chips-card
                        alignment: end
                        chips:
                          - type: template
                            entity: input_boolean.washing_machine_notification_sim
                            icon: >-
                              {{ 'mdi:bell-ring' if is_state('input_boolean.washing_machine_notification_sim', 'on') else 'mdi:bell-off-outline' }}
                            icon_color: >-
                              {{ 'blue' if is_state('input_boolean.washing_machine_notification_sim', 'on') else 'grey' }}
                            content: Benachrichtigung
                            tap_action:
                              action: toggle
                        card_mod:
                          style: |
                            ha-card {
                              border: 0 !important;
                              box-shadow: none !important;
                              background: transparent !important;
                              padding: 0 8px 6px !important;
                            }
                  - type: custom:stack-in-card
                    card_mod:
                      style: |
                        ha-card {
                          border: 0 !important;
                          box-shadow: none !important;
                          background: rgba(var(--rgb-primary-text-color), 0.035) !important;
                          border-radius: 12px !important;
                        }
                    cards:
                      - type: custom:mushroom-template-card
                        entity: input_boolean.dryer_power_sim
                        primary: Trockner
                        secondary: >-
                          {{ 'Aus' if is_state('input_boolean.dryer_power_sim', 'off') else states('input_select.dryer_state_sim') }}
