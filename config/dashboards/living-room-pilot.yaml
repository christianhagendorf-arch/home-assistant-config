views:
  - title: Erdgeschoss
    path: ground_floor
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:stack-in-card
            grid_options:
              columns: 12
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 14px;
                  box-shadow: none;
                  overflow: hidden;
                }
            cards:
              - type: custom:mushroom-template-card
                primary: Hauseingang
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      border: 0 !important;
                      box-shadow: none !important;
                      background: transparent !important;
                      --card-primary-font-size: 14px;
                      --card-primary-line-height: 18px;
                      padding: 0 !important;
                    }
                    mushroom-state-item {
                      min-height: 32px;
                      padding: 5px 10px 1px !important;
                    }
              - type: custom:mushroom-light-card
                entity: light.entrance_outside_sim
                name: Außenbeleuchtung
                icon: mdi:outdoor-lamp
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      border: 0 !important;
                      box-shadow: none !important;
                      background: transparent !important;
                    }

          - type: custom:stack-in-card
            grid_options:
              columns: 12
            card_mod:
