# Simulation only. No production entity references.
input_boolean:
  living_room_demo_light_power_sim:
    name: Wohnzimmer Demolicht Schalter (Sim)
  living_room_arc_lamp_power_sim:
    name: Wohnzimmer Bogenlampe Schalter (Sim)
  living_room_tv_board_sim:
    name: Wohnzimmer TV-Board (Sim)

input_number:
  living_room_temperature_input_sim:
    name: Wohnzimmer Istwert Vorgabe (Sim)
    min: 10
    max: 35
    step: 0.1
    initial: 20.3
    unit_of_measurement: "°C"
  living_room_target_temperature_sim:
    name: Wohnzimmer Sollwert (Sim)
    min: 16
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    initial: 21
  living_room_demo_brightness_sim:
    name: Wohnzimmer Helligkeit (Sim)
    min: 1
    max: 255
    step: 1
    initial: 153

input_select:
  living_room_hvac_mode_sim:
    name: Wohnzimmer Heizmodus (Sim)
    options: ["off", "heat"]
    initial: "off"

template:
  - sensor:
      - name: Wohnzimmer Temperatur (Sim)
        default_entity_id: sensor.living_room_temperature_sim
        unique_id: pilot_living_room_temperature_sim
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        availability: "{{ has_value('input_number.living_room_temperature_input_sim') }}"
        state: "{{ states('input_number.living_room_temperature_input_sim') | float(none) }}"
  - light:
      - name: Wohnzimmer Demolicht (Sim)
        default_entity_id: light.living_room_demo_light_sim
        unique_id: pilot_living_room_demo_light_sim
        availability: >-
          {{ has_value('input_boolean.living_room_demo_light_power_sim')
             and has_value('input_number.living_room_demo_brightness_sim') }}
        state: "{{ is_state('input_boolean.living_room_demo_light_power_sim', 'on') }}"
        level: "{{ states('input_number.living_room_demo_brightness_sim') | int(153) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_demo_light_power_sim
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_demo_light_power_sim
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_demo_brightness_sim
            data:
              value: "{{ brightness | int }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_demo_light_power_sim
      - name: Wohnzimmer Bogenlampe (Sim)
        default_entity_id: light.living_room_arc_lamp_sim
        unique_id: pilot_living_room_arc_lamp_sim
        availability: "{{ has_value('input_boolean.living_room_arc_lamp_power_sim') }}"
        state: "{{ is_state('input_boolean.living_room_arc_lamp_power_sim', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_arc_lamp_power_sim
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_arc_lamp_power_sim
  - climate:
      - name: Wohnzimmer Heizung (Sim)
        default_entity_id: climate.living_room_sim
        unique_id: pilot_living_room_climate_sim
        temperature_unit: "°C"
        precision: 0.1
        min_temperature: 16
        max_temperature: 24
        target_temperature_step: 0.5
        availability: >-
          {{ has_value('input_select.living_room_hvac_mode_sim')
             and has_value('input_number.living_room_target_temperature_sim')
             and has_value('sensor.living_room_temperature_sim') }}
        current_temperature: "{{ states('sensor.living_room_temperature_sim') | float(none) }}"
        target_temperature: "{{ states('input_number.living_room_target_temperature_sim') | float(none) }}"
        hvac_modes: "{{ ['off', 'heat'] }}"
        hvac_mode: "{{ states('input_select.living_room_hvac_mode_sim') }}"
        hvac_action: >-
          {% set current = states('sensor.living_room_temperature_sim') | float(none) %}
          {% set target = states('input_number.living_room_target_temperature_sim') | float(none) %}
          {% if is_state('input_select.living_room_hvac_mode_sim', 'off') %}off
          {% elif current is not none and target is not none and current < target %}heating
          {% else %}idle{% endif %}
        set_hvac_mode:
          - action: input_select.select_option
            target:
              entity_id: input_select.living_room_hvac_mode_sim
            data:
              option: "{{ hvac_mode }}"
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_target_temperature_sim
            data:
              value: "{{ temperature | float }}"

script:
  living_room_heat_toggle_sim:
    alias: Wohnzimmer Heizung umschalten (Sim)
    mode: queued
    sequence:
      - condition: template
        value_template: "{{ states('climate.living_room_sim') in ['off', 'heat'] }}"
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.living_room_sim
        data:
          hvac_mode: "{{ 'off' if is_state('input_select.living_room_hvac_mode_sim', 'heat') else 'heat' }}"
