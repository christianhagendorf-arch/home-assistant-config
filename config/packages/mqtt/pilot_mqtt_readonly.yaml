      unit_of_measurement: "%"
      entity_category: diagnostic

    - name: Schlafzimmer Linkquality MQTT
      default_entity_id: sensor.bedroom_linkquality_mqtt
      unique_id: ha_test_bedroom_linkquality_mqtt
      state_topic: zigbee2mqtt/temp_schlafzimmer
